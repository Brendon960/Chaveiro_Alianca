<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Em manutenção — {{NAME}}</title>
  <meta name="theme-color" content="#0A1F3D">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: 'Inter', system-ui, sans-serif; color: rgba(255,255,255,.82);
      background: radial-gradient(900px 500px at 80% 20%, rgba(28,66,117,.9), transparent 60%),
                  linear-gradient(160deg, #0A1F3D, #040E1F);
    }
    .card { width: min(560px, 100%); text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 18px; }
    .tag { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,194,14,.12); color: #FFC20E; font: 700 .78rem/1.2 'Space Grotesk', sans-serif; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
    h1 { font: 700 clamp(1.8rem, 5vw, 2.6rem)/1.15 'Space Grotesk', sans-serif; color: #fff; margin: 0 0 16px; }
    p { font-size: 1.08rem; line-height: 1.6; margin: 0 0 32px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 14px 28px; border-radius: 999px; background: #FFC20E; color: #071830; font-weight: 600; text-decoration: none; }
    .btn:hover { background: #FFCD3A; }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .btn svg { width: 22px; height: 22px; }
    footer { margin-top: 48px; font-size: .85rem; color: rgba(255,255,255,.45); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/img/favicon.svg" alt="">
    <span class="tag">Site em manutenção</span>
    <h1>{{NAME}}</h1>
    <p>{{MESSAGE}}</p>
    <a class="btn" href="{{WA_URL}}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.32l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.23-9.43 9.44-9.43a9.4 9.4 0 0 1 9.43 9.44c0 5.2-4.24 9.43-9.44 9.43m8.03-17.47A11.3 11.3 0 0 0 12.05.7C5.79.7.69 5.8.69 12.06c0 2 .52 3.96 1.52 5.68L.6 23.6l6-1.57a11.3 11.3 0 0 0 5.44 1.39h.01c6.26 0 11.36-5.1 11.36-11.36 0-3.03-1.18-5.89-3.33-8.03"/></svg>
      Falar pelo WhatsApp
    </a>
    <footer>Voltaremos em breve.</footer>
  </main>
</body>
</html>
